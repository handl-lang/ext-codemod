[patch."https://github.com/handl-lang/kit-core"]
# T-123 Phase A: `handl-kit-core` is a workspace member now — external kits
# (kit-stdlib, kit-prelude, kit-ffi, …) that still declare the git dep
# resolve to this member until the consumer-repoint sweep.
