handl-plugin-exec-cache = { path = "../host/crates/plugin-exec-cache" }
handl-plugin-ext-compile = { path = "../host/crates/plugin-ext-compile" }
handl-plugin-ext-detect = { path = "../host/crates/plugin-ext-detect" }
handl-plugin-ext-diag = { path = "../host/crates/plugin-ext-diag" }
handl-plugin-ext-eval = { path = "../host/crates/plugin-ext-eval" }
handl-plugin-ext-fmt = { path = "../host/crates/plugin-ext-fmt" }
handl-plugin-ext-kit = { path = "../host/crates/plugin-ext-kit" }
handl-plugin-ext-lint = { path = "../host/crates/plugin-ext-lint" }
handl-plugin-ext-plugin = { path = "../host/crates/plugin-ext-plugin" }
handl-plugin-ext-refinement = { path = "../host/crates/plugin-ext-refinement" }
handl-plugin-ext-codegen = { path = "../host/crates/plugin-ext-codegen" }
handl-plugin-ext-test = { path = "../host/crates/plugin-ext-test" }
handl-plugin-ext-typecheck = { path = "../host/crates/plugin-ext-typecheck" }
handl-plugin-lib-handl = { path = "../host/crates/plugin-lib-handl" }
