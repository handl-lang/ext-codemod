[package]
name = "hnl-ext-codemod"
version = "0.1.0"
edition = "2024"
description = "`hnl codemod` — declarative codemods as a dynamic `hnl` extension (ADR-0149, PL-004)."
license = "MIT"
repository = "https://github.com/handl-lang/ext-codemod"
homepage = "https://handl-lang.github.io/docs/ext-codemod/"
documentation = "https://handl-lang.github.io/docs/ext-codemod/reference/"
readme = "README.md"
keywords = ["handl", "extension", "cli", "codemod"]
categories = ["development-tools"]
# Git-install only: https://github.com/handl-lang/ext-codemod (no crates.io).
publish = false

[lib]
# `cdylib` is the shipped artifact (`libhnl_ext_codemod.{so,dylib,dll}`);
# `rlib` keeps `cargo test` statically linked (ADR-0149 §Consequences).
crate-type = ["cdylib", "rlib"]

[dependencies]
handl-ext = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-kit-prelude = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-kit-pkg = { git = "https://github.com/handl-lang/kit-pkg", branch = "main" }
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
# PL-004: the `hnl codemod` command surface — `codemod_command` parses argv
# (`plan|apply|revert <spec> [--json] [--check]`) and drives the codemod
# registry over the `hnl-engine-codemod` spec model. Codemod NEVER
# destroys — `revert` is the only undo path.
handl-plugin-ext-codemod = { git = "https://github.com/handl-lang/host", branch = "main" }
serde_json = "1"

[profile.dev]
opt-level = 1

# PL-004 T-086: nothing is pushed yet — host@main lacks `handl-plugin-codemod`
# and `handl-plugin-ext-codemod`, and `engine-codemod` has no git remote at
# all. The patch table mirrors the host workspace's dev-link table (every
# `crates/` path repointed at `../host/crates/`) so transitive git deps
# resolve to the sibling checkouts; once the remotes carry the crates this
# block can shrink back to the kit crates (same convention as
# ext-codegen's dev-link patch table).
[patch."https://github.com/handl-lang/compile-dot"]
handl-plugin-compile-dot = { path = "../engine-compile-dot/modules/compile-dot" }
[patch."https://github.com/handl-lang/compile-handl"]
handl-plugin-compile-handl = { path = "../engine-compile-handl/modules/compile-handl" }
[patch."https://github.com/handl-lang/compile-js"]
handl-plugin-compile-js = { path = "../engine-compile-js" }
[patch."https://github.com/handl-lang/compile-llvm"]
handl-plugin-compile-llvm = { path = "../engine-compile-llvm" }
[patch."https://github.com/handl-lang/compile-sexp"]
handl-plugin-compile-sexp = { path = "../engine-compile-sexp/modules/compile-sexp" }
[patch."https://github.com/handl-lang/compile-term"]
handl-plugin-compile-term = { path = "../engine-compile-term/modules/compile-term" }
[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }
[patch."https://github.com/handl-lang/engine-exec"]
hnl-engine-exec = { path = "../engine-exec" }
[patch."https://github.com/handl-lang/engine-exec-bytecode"]
hnl-engine-exec-bytecode = { path = "../engine-exec-bytecode" }
[patch."https://github.com/handl-lang/engine-exec-cranelift"]
hnl-engine-exec-cranelift = { path = "../engine-exec-cranelift" }
[patch."https://github.com/handl-lang/engine-exec-tree-walk"]
